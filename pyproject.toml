[project]
name = "agentsec"
version = "0.1.0"
description = "A small multi-agent system built to be attacked, defended and retested."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langchain>=1,<2",
    "langchain-ollama>=1,<2",
    "pydantic>=2.9,<3",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
agentsec = "agentsec.cli:app"

[dependency-groups]
dev = [
    # httpx is required by FastAPI's TestClient.
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The cache provider is off because the test container has a read-only root filesystem.
addopts = "-ra --strict-markers -p no:cacheprovider -m 'not llm'"
markers = [
    "llm: real runs against Ollama, excluded by default",
    "container: asserts the hardening of the Compose test container; fails on a bare host",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
